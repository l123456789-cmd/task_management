# Task Flow Platform - Nginx Reverse Proxy Template
# -------------------------------------------------------------------
# 这个配置文件用于在真实的 Linux 生产环境中使用 Nginx 将对外 HTTP(s) 请求
# 安全、高效地反向代理给后台 8000 端口持续运行的 FastAPI 引擎。
# -------------------------------------------------------------------

server {
    # 监听默认 HTTP 端点
    listen 80;
    
    # [需要修改] 请将其替换为您分配的真实公网域名，或所在的局域网机器 IP 地址
    server_name www.yourdomain.com 192.168.x.x;

    # 如果有大体量附件上传的诉求，由于 Nginx 默认有 1M 上传限制，必须将其放宽（这里放开至 500MB 大小）
    client_max_body_size 500M;

    location / {
        # 核心转发点：将该站点的请求全部代理交付给 FastAPI 的 Uvicorn (因为前后端挂载已统一在后端口)
        proxy_pass http://127.0.0.1:8000;
        
        # 向上游程序传递真实的请求报文拦截头 (客户端 IP 与来源)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # HTTPVersion 需要设置，防止 WebSocket 或连接掉线 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
